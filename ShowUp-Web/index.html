<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0F">
<title>ShowUp · Hari ini</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ShowUp">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@500;700&display=swap">
<style>
:root{color-scheme:dark}
html,body{margin:0;background:#0B0B0F}
body{color:#EDEDF2;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{width:390px;max-width:100%;margin:0;box-sizing:border-box;padding:28px 16px 32px;display:flex;flex-direction:column;gap:14px;--c0:0ms;--hold:2500ms;--op0:1}
.app.off{--op0:.62}
@media (min-width:640px){.app{margin:0 auto}}
.disp{font-family:'Bricolage Grotesque',Geist,sans-serif}
.haptic{position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
[hidden]{display:none !important}
body{padding-top:env(safe-area-inset-top)}

/* login */
.login{width:390px;max-width:100%;box-sizing:border-box;padding:72px 20px 32px;display:flex;flex-direction:column;gap:18px}
@media (min-width:640px){.login{margin:0 auto}}
.login h1{margin:0;font-size:44px;font-weight:800;letter-spacing:-0.045em;line-height:1}
.login p{margin:0;font-size:14px;line-height:1.45;color:#A1A1AE}
.login form{display:flex;flex-direction:column;gap:10px}
.login label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8B8B98}
.field{height:52px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:#14141A;color:#EDEDF2;font:500 17px Geist,system-ui,sans-serif;padding:0 16px;outline:none}
.field:focus{border-color:#A78BFA}
.field.code{font-family:'Geist Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.3em;text-align:center}
.primary{height:52px;border-radius:16px;border:0;background:#EDEDF2;color:#0B0B0F;font:600 16px Geist,system-ui,sans-serif;cursor:pointer}
.primary:disabled{opacity:.5;cursor:default}
.login .msg{font-size:13px;color:#A1A1AE;min-height:18px}
.login .msg.err{color:#FCA5A5}
.linkbtn{background:none;border:0;padding:8px 0;color:#8B8B98;font:500 13px Geist,system-ui,sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.sync{font-size:12px;color:#6E6E7A;text-align:center;min-height:16px}
.sync.warn{color:#FDBA74}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:0 4px}
.brand{font-size:34px;font-weight:800;letter-spacing:-0.04em;line-height:1}
.date{font-size:13px;color:#8B8B98;padding-bottom:4px}

/* countdown */
.cd{border-radius:22px;padding:18px 18px 16px;background:#14141A;border:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:6px;transition:background 400ms,border-color 400ms}
.cd-l{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.cd-dot{width:7px;height:7px;border-radius:50%;background:var(--dot)}
.cd-big{color:var(--fg);line-height:1.05}
.cd-big.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:46px;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.cd-big.txt{font-family:'Bricolage Grotesque',Geist,sans-serif;font-size:30px;font-weight:700;letter-spacing:-0.03em;line-height:1.1}
.cd-sub{font-size:13px;color:#A1A1AE}
.cd[data-tone=calm]{--fg:#EDEDF2;--dot:#8B8B98}
.cd[data-tone=warm]{--fg:#FDBA74;--dot:#FB923C;background:rgba(251,146,60,.08);border-color:rgba(251,146,60,.30)}
.cd[data-tone=urgent]{--fg:#FCA5A5;--dot:#F87171;background:rgba(248,113,113,.10);border-color:rgba(248,113,113,.38)}
.cd[data-tone=off]{--fg:#C9C9D3;--dot:#6E6E7A;background:#101015;border-color:rgba(255,255,255,.06)}
.cd[data-tone=done]{--fg:#F4F4F7;--dot:#86EFAC;border-color:rgba(255,255,255,.16)}
.cd[data-tone=warm] .cd-dot,.cd[data-tone=urgent] .cd-dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

/* text swap (old value leaves, new value arrives) */
.swap{display:inline-grid;overflow:hidden;vertical-align:bottom}
.swap>span{grid-area:1/1}
.swap>.old{display:none}
.app.celebrating .swap>.old{display:block}

/* frog */
.frog{display:flex;align-items:center;gap:12px;padding:4px 4px 2px}
.frog-t{font-size:16px;font-weight:700}
.frog-s{font-size:13px;color:#8B8B98}

/* progress */
.prog-wrap{display:flex;flex-direction:column;gap:8px;padding:0 4px 4px}
.prog-row{display:flex;justify-content:space-between;font-size:13px}
.prog-row b{font-weight:600}
.prog-note{color:#8B8B98}
.segs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg{height:6px;border-radius:999px;background:#22222B;position:relative}
.seg .fill{position:absolute;inset:0;border-radius:inherit;background:var(--c);box-shadow:0 0 10px var(--c55);transform:scaleX(0);transform-origin:left center;transition:transform 300ms ease-out}
.seg.on .fill{transform:none}

/* ───────── cards: two states, dim (not done today) and lit (done) ───────── */
.card{--op:1;position:relative;border-radius:22px;background:#14141A;border:1px solid rgba(255,255,255,.06);padding:16px;display:flex;flex-direction:column;gap:14px;opacity:var(--op);transition:opacity 300ms}
.app.off .card:not(.done){--op:.62}
.head{display:flex;align-items:center;gap:12px}
.ico{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#1F1F27;color:#8B8B98}
.card.done .ico{background:var(--c14);color:var(--c)}
.meta{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{display:flex;align-items:center;gap:8px}
.name{font-size:19px;font-weight:700;letter-spacing:-0.02em}
.badge{font-size:13px;font-weight:600;line-height:18px;color:var(--c);background:var(--c14);padding:1px 9px;border-radius:999px;opacity:0;transform:scale(.4);transform-origin:left center}
.card.done .badge{opacity:1;transform:none}
.desc{font-size:13px;line-height:1.35;color:#A1A1AE}

.orbwrap{position:relative;width:64px;height:64px;flex-shrink:0}
.hold{position:absolute;inset:0;width:64px;height:64px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;z-index:2}
.hold:focus-visible{outline:2px solid #EDEDF2;outline-offset:4px}
.card.done .hold{cursor:default}
.orb{position:absolute;inset:0;transition:transform 260ms ease-out}
.orb svg.ring{position:absolute;inset:0;overflow:visible}
.prog{stroke:var(--c45);stroke-dasharray:157.08;stroke-dashoffset:157.08}
.card.done .prog{stroke:var(--c);stroke-dashoffset:0}
.inner{position:absolute;inset:10px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1F1F27;color:#8B8B98}
.card.done .inner{background:var(--c);box-shadow:0 0 16px var(--c40)}
.lbl{position:absolute;font:600 12px Geist,system-ui,sans-serif;letter-spacing:.01em}
.card.done .lbl{opacity:0}
.chk,.gchk{position:absolute;opacity:0}
.card.holding.celebrating .gchk{animation:ghostin 300ms ease-out calc(var(--hold) / 2) forwards,ghostoff 300ms linear calc(var(--c0) + 1900ms) forwards}
@keyframes ghostoff{0%,100%{opacity:0}}
.card.done .chk{opacity:1}

.grid{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:4px;justify-content:space-between}
.cell{width:14px;height:14px;border-radius:4px;background:#1B1B23;box-sizing:border-box;border:1.5px solid transparent}
.cell.future{background:transparent}
.cell.on{background:var(--c40)}
.card.done .cell.on{background:var(--c88)}
.cell.today{position:relative;z-index:2;background:transparent;border-style:dashed;border-color:var(--c)}
.card.done .cell.today{background:var(--c);border-color:transparent;box-shadow:0 0 12px var(--c75)}

.foot{display:flex;align-items:center;justify-content:space-between;margin:-6px -8px -8px 0}
.foot span{font-size:12px;color:#6E6E7A}
.iconbtn{width:44px;height:32px;border-radius:999px;border:0;background:transparent;color:#8B8B98;cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:rgba(255,255,255,.06);color:#EDEDF2}
.iconbtn:focus-visible,.ghost:focus-visible{outline:2px solid #EDEDF2;outline-offset:2px}
.menu{display:none;flex-wrap:wrap;gap:8px;margin-top:-4px}
.card.menu-open .menu{display:flex}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.1);color:#C9C9D3;border-radius:999px;font:500 12px Geist,system-ui,sans-serif;padding:0 14px;height:36px;cursor:pointer}
.ghost:hover{background:rgba(255,255,255,.05)}
.ghost.danger{color:#FCA5A5;border-color:rgba(248,113,113,.4)}

.bottom{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:10px}
.hint{font-size:12px;color:#6E6E7A}
.confirm{display:flex;align-items:center;gap:8px;font-size:13px;color:#C9C9D3}

/* ───────── stage: the pressed button lifts out of its card, comes alive, the result lands under it, then it flies home ───────── */
.stage{display:none;position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.stage.capture{position:absolute;left:0;top:0;right:auto;bottom:auto;width:390px;height:844px}
.app.celebrating .stage{display:block}
/* scrim: near-opaque so the dashboard is hidden (not dimmed); lifts away top → bottom following the button home */
.scrim{position:absolute;inset:0;opacity:0;background:linear-gradient(to bottom,rgba(11,11,15,0) 0%,rgba(11,11,15,0) 40%,rgba(11,11,15,.97) 60%,rgba(11,11,15,.97) 100%) 0 100%/100% 250% no-repeat}
.hero{position:absolute;left:calc(var(--sx) - 77px);top:calc(var(--sy) - 77px);width:154px;height:154px;opacity:0}
.hmove{position:absolute;inset:0}
/* drawn with real width/height (not a scale) so the ring stays an even thickness: a soft body, not a tilting coin */
.hbody{position:absolute;left:50%;bottom:0;width:154px;height:154px;box-sizing:border-box;border:11px solid var(--c);border-radius:50%;background:#23232C;transform:translateX(-50%)}
.hhalo{position:absolute;inset:-70px;border-radius:50%;background:radial-gradient(circle,var(--c55) 0%,var(--c24) 34%,transparent 66%);opacity:0}
.hbody{border-color:var(--c45)}
.hinner{position:absolute;inset:13px;border-radius:inherit;background:var(--c24s);display:flex;align-items:center;justify-content:center;overflow:hidden}
/* ignite: saturated colour floods outward from the check, with a white-hot core */
.hinner::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--c);transform:scale(0)}
.hinner::after{content:'';position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,#FFFFFF 0%,rgba(255,255,255,.85) 30%,rgba(255,255,255,0) 70%);opacity:0;transform:scale(.2)}
.hck{position:relative;z-index:2;width:46%;height:46%;overflow:visible}
.hck path{stroke:#B4B4BF}
.sfx{position:absolute;width:0;height:0}
.sfx.top{left:var(--tx);top:var(--ty)}
.wc .sfx{left:50%;top:50%;z-index:2}
.sp{position:absolute;left:calc(var(--w) / -2);top:calc(var(--h) / -2);width:var(--w);height:var(--h);border-radius:999px;background:var(--bg);opacity:0}
.slot{position:absolute;inset:4px;border-radius:50%;border:2px dashed var(--c55);opacity:0;pointer-events:none}

/* payoff block under the hero: name, big count, last 7 days (today last) */
.pay{position:absolute;left:var(--tx);top:calc(var(--ty) + 92px);width:358px;margin-left:-179px;display:flex;flex-direction:column;align-items:center}
.pname,.pcount,.week{opacity:0}
.pname{font-family:'Bricolage Grotesque',Geist,sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.035em;color:#FFFFFF;line-height:1.1}
.pcount{display:flex;flex-direction:column;align-items:center;margin-top:2px}
.pnum{font-family:'Geist Mono',ui-monospace,monospace;font-size:92px;font-weight:700;letter-spacing:-0.05em;line-height:1;font-variant-numeric:tabular-nums;color:#FFFFFF;display:flex;align-items:baseline}
.pnum .of{color:#4A4A55}
.proll{display:inline-grid;overflow:hidden;padding:0 2px}
.proll>span{grid-area:1/1}
.proll>.new{color:var(--c)}
.plab{font-size:13px;color:#A1A1AE;margin-top:2px}
.week{display:flex;gap:6px;margin-top:24px}
.wd{display:flex;flex-direction:column;align-items:center;gap:7px;opacity:0}
.wl{font-size:12px;font-weight:600;color:#8B8B98;letter-spacing:.02em}
.wd.is-today .wl{color:#FFFFFF}
.wc{position:relative;width:46px;height:46px;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#1F1F27;border:2px solid rgba(255,255,255,.10)}
.wc.on{background:var(--c);border-color:var(--c)}
.wc svg{opacity:0}
.wc.on svg{opacity:1}
.wc.today{background:transparent;border:2px dashed var(--c)}

/* ───────── HOLD (t = 0 … --hold): charging up, not a progress bar ─────────
   press: button sinks under the finger · arc (45%) eases round with a white-hot leading tip
   core warms toward the habit tint and its glow grows · specks get pulled IN toward the button
   "Tahan" → "Terus…" → outline check · tremble builds only in the last 20% */
.card.holding .prog{animation:ringfill var(--hold) cubic-bezier(.3,.08,.55,1) forwards}
.card.holding .tip{animation:tipfill var(--hold) cubic-bezier(.3,.08,.55,1) forwards,tipshow var(--hold) linear forwards}
.card.holding .orb{animation:charge var(--hold) linear forwards}
.card.holding .orbwrap{animation:tremble var(--hold) linear forwards}
.card.holding .inner{animation:innerseep var(--hold) cubic-bezier(.5,0,.7,1) forwards}
.card.holding .lbl{animation:lblout 250ms ease-out forwards}
.card.holding .lbl2{animation:terus var(--hold) linear forwards}
.card.holding .gchk{animation:ghostin 300ms ease-out calc(var(--hold) * .66) forwards}
.card.holding .gs{animation:gather 520ms cubic-bezier(.55,0,.85,.4) calc(var(--hold) * var(--f)) both}
.card.holding{animation:cardcharge var(--hold) linear forwards}
.orb{transform-origin:50% 80%}
.inner{transition:background-color 260ms ease-out,box-shadow 260ms ease-out}
.tip{stroke:#FFFFFF;stroke-dasharray:3 157.08;stroke-dashoffset:3;opacity:0;filter:drop-shadow(0 0 3px rgba(255,255,255,.9));transition:opacity 200ms}
.lbl2{position:absolute;font:600 12px Geist,system-ui,sans-serif;letter-spacing:-.02em;opacity:0;white-space:nowrap}
.gather{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3}
.gs{position:absolute;left:calc(var(--s) / -2);top:calc(var(--s) / -2);width:var(--s);height:var(--s);border-radius:50%;background:var(--b);opacity:0}
@keyframes ringfill{from{stroke:var(--c45);stroke-dashoffset:157.08}to{stroke:var(--c45);stroke-dashoffset:0}}
@keyframes tipfill{from{stroke-dashoffset:3}to{stroke-dashoffset:-154.08}}
@keyframes tipshow{0%{opacity:0}6%,100%{opacity:1}}
.card.holding.celebrating .prog{animation:ringfill var(--hold) cubic-bezier(.3,.08,.55,1) forwards,ringdone 300ms linear calc(var(--c0) + 3100ms) forwards}
.card.holding.celebrating .tip{animation:tipfill var(--hold) cubic-bezier(.3,.08,.55,1) forwards,tipshow var(--hold) linear forwards,tipoff 300ms linear var(--c0) forwards}
@keyframes tipoff{from,to{opacity:0}}
@keyframes ringdone{from,to{stroke:var(--c);stroke-dashoffset:0}}
/* sinks fast on press, then keeps compressing; ends on the pose the stage hero takes over from */
@keyframes charge{
  0%{transform:none;animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  8%{transform:scale(1.05,.95)}
  70%{transform:rotate(-2deg) scale(1.12,.89);animation-timing-function:ease-in}
  100%{transform:rotate(-5deg) scale(1.2,.83)}}
@keyframes tremble{0%,80%{transform:none}82%{transform:translate(0.5px,-0.4px)}84%{transform:translate(-0.7px,0.5px)}86%{transform:translate(0.8px,-0.6px)}88%{transform:translate(-1.0px,0.6px)}90%{transform:translate(1.1px,-0.8px)}92%{transform:translate(-1.3px,0.8px)}94%{transform:translate(1.4px,-1.0px)}96%{transform:translate(-1.6px,1.0px)}98%{transform:translate(1.6px,-1.1px)}100%{transform:none}}
@keyframes innerseep{from{background:#1F1F27;box-shadow:0 0 0 transparent}to{background:var(--c24s);box-shadow:0 0 18px 3px var(--c24)}}
@keyframes lblout{from{opacity:1;transform:none}to{opacity:0;transform:scale(.7)}}
@keyframes terus{0%,12%{opacity:0;transform:scale(.8)}20%,58%{opacity:1;transform:none}66%,100%{opacity:0;transform:scale(.9)}}
@keyframes ghostin{from{opacity:0}to{opacity:1}}
/* specks drift in from outside and vanish into the rim */
@keyframes gather{
  0%{opacity:0;transform:translate(var(--x),var(--y)) scale(.6)}
  25%{opacity:1}
  85%{opacity:1;transform:translate(calc(var(--x) * .3),calc(var(--y) * .3)) scale(1)}
  100%{opacity:0;transform:translate(calc(var(--x) * .2),calc(var(--y) * .2)) scale(.4)}}
@keyframes cardcharge{from{border-color:rgba(255,255,255,.06);opacity:var(--op0)}to{border-color:var(--c22);opacity:1}}

/* ───────── CELEBRATION (t = --c0 …)  stage runs c0 … c0+3100 ─────────
   lift 0–300 · crouch 300–600 · stretch + flood 680–880 · land 980 · overshoot 1100–1200 · settled + lit 1380
   payoff on stage: name + 2/4 1250 · flip to 3/4 1600 · 7-day row 1950 · today fills last 2300
   fly home 2750–3100 · dock + gentle echoes 3100–3560 (at rest ≈3.56s after completion)
   The dashboard switches to its final state at c0+300, hidden under the opaque scrim — once the stage says 3/4, nothing on screen says otherwise. */
.card.celebrating .orb{animation:orbaway 3400ms linear var(--c0) forwards}
.card.holding.celebrating .orb{animation:charge var(--hold) linear forwards,orbaway 3400ms linear var(--c0) forwards}
@keyframes orbaway{
  0%{opacity:0;transform:none}
  91.1%{opacity:0;transform:none}
  91.2%{opacity:1;transform:none;animation-timing-function:cubic-bezier(.3,.8,.4,1)}
  95.6%{opacity:1;transform:scale(1.12,.9)}
  100%{opacity:1;transform:none}}
.card.celebrating .slot{animation:slot 3100ms linear var(--c0) forwards}
@keyframes slot{0%,99.6%{opacity:1}100%{opacity:0}}
.card.holding.celebrating .inner{animation:innerseep var(--hold) cubic-bezier(.5,0,.7,1) forwards,innerdone 300ms linear calc(var(--c0) + 3100ms) forwards}
@keyframes innerdone{from{background:var(--c);box-shadow:0 0 16px var(--c40)}to{background:var(--c);box-shadow:0 0 16px var(--c40)}}
.card.celebrating .chk{animation:chkin 300ms linear calc(var(--c0) + 3080ms) both}
@keyframes chkin{0%{opacity:0}1%,100%{opacity:1}}
.card.holding.celebrating .gchk{animation:ghostin 300ms ease-out calc(var(--hold) * .66) forwards,ghostoff 300ms linear calc(var(--c0) + 3050ms) forwards}
@keyframes ghostoff{0%,100%{opacity:0}}

.app.celebrating .scrim{animation:scrim 3100ms linear var(--c0) forwards}
@keyframes scrim{
  0%{opacity:0;background-position:0 100%;animation-timing-function:ease-out}
  9.68%{opacity:1;background-position:0 100%}
  88.71%{opacity:1;background-position:0 100%;animation-timing-function:cubic-bezier(.4,0,.6,1)}
  99%{opacity:1;background-position:0 0%}
  100%{opacity:0;background-position:0 0%}}
.app.celebrating .hero{animation:heroshow 3100ms linear var(--c0) forwards}
@keyframes heroshow{0%,99.7%{opacity:1}100%{opacity:0}}
.app.celebrating .hmove{animation:travel 3100ms linear var(--c0) forwards}
@keyframes travel{
  0%{transform:translate(0,0) scale(.4156);animation-timing-function:cubic-bezier(.3,.8,.35,1.04)}
  9.68%{transform:translate(var(--hx),var(--hy)) scale(1)}
  88.71%{transform:translate(var(--hx),var(--hy)) scale(1);animation-timing-function:cubic-bezier(.45,0,.4,1)}
  100%{transform:translate(0,0) scale(.4156)}}
.app.celebrating .hbody{animation:shape 3100ms linear var(--c0) forwards}
@keyframes shape{
  0.00%{width:185px;height:128px;border-radius:50%;transform:translateX(-50%) rotate(-5deg);animation-timing-function:ease-out}
  4.84%{width:142px;height:168px;border-radius:50%;transform:translateX(-50%) translateY(-6px);animation-timing-function:ease-in-out}

  /* ───────── haptics ─────────

  /* ───────── reset ───────── */
  function renderReset() {
    var z = $('resetZone');
    z.innerHTML = S.confirming
      ? '<div class="confirm"><span>Hapus semua riwayat?</span><button class="ghost" type="button" data-r="no">Batal</button><button class="ghost danger" type="button" data-r="yes">Hapus</button></div>'

    complete(CAP_KEY, 'capture');
    requestAnimationFrame(function () {
      document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = CAP_T; });
    });
  } else if (LIVE) {
    bootLive();
    /* tick the countdown; at local midnight rebuild "today" from the data */
    setInterval(function () { if (dayKey(0) !== today) refreshAll(); renderCountdown(); }, 1000);
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
